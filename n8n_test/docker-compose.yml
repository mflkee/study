services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    user: "1000:1000"  # <-- явно указываем UID:GID
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=your_password
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Moscow
    volumes:
      - n8n_data:/home/node/.n8n
    # Или если хочешь хранить на хосте:
    # volumes:
    #   - ./n8n_data:/home/node/.n8n

volumes:
  n8n_data:
