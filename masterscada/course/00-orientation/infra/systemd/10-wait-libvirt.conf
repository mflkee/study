# Drop-in для docker.service: не стартовать раньше libvirtd.
#
# Зачем: compose публикует порт БД ещё и на 192.168.122.1 (шлюз моста virbr0),
# чтобы до стенда дотягивалась среда разработки в VM (Astra). Адрес на virbr0
# назначает libvirtd при старте. Если docker.service успевает подняться первым
# (наблюдалось 2026-10-15: docker 07:05:29, libvirtd 07:05:30), публикация
# падает с «failed to bind host port 192.168.122.1:15444/tcp: cannot assign
# requested address» — контейнер остаётся «Up (healthy)», но БЕЗ сети и без
# порта, и IDE получает Connection refused.
#
# Установка:
#   sudo install -Dm644 10-wait-libvirt.conf \
#     /etc/systemd/system/docker.service.d/10-wait-libvirt.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart docker          # перечитать порядок зависимостей
# Проверка после перезагрузки:
#   docker compose ps                      # оба адреса: 127.0.0.1 + 192.168.122.1

[Unit]
Wants=libvirtd.service
After=libvirtd.service
