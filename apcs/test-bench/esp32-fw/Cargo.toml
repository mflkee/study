[package]
name = "esp32-modbus-fw"
version = "0.1.0"
edition = "2021"

[dependencies]
# ESP32
esp-idf-hal = "0.44"
esp-idf-sys = "0.35"

# Logging
log = "0.4"

# Error handling
anyhow = "1.0"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = "fat"

[[bin]]
name = "esp32-modbus-fw"
path = "src/main.rs"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.3"