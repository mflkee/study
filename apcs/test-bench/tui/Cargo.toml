[package]
name = "esp32-tui"
version = "0.1.0"
edition = "2021"
description = "Universal TUI frontend for ESP32 Modbus test bench"

[dependencies]
# TUI
ratatui = "0.30.1"
crossterm = "0.29"

# Serial port (cross-platform: Linux/macOS/Windows)
serialport = "4.10"

# Register map + CRC (общие с эмулятором/прошивкой)
crc32fast = { version = "1", optional = true }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"

# Async: фоновая работа потоков
crossbeam-channel = "0.5"

# Для обнаружения и управления ESP32-портами
dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2