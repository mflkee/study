# Конфигурация cargo для этой папки — «всё ради прошивки на ESP32-S3».
#
# Три кита этого файла:
#
# 1. target — всегда собираемся под xtensa-esp32s3-espidf (FFI-термин «OS ESIDF»);
# 2. linker + rustflags — линкуем через ldproxy (компоновщик ESP-IDF),
#    и включаем --cfg espidf_time64 (время считается 64-битным — иначе
#    сломаются таймеры и NVS на 32-битной time_t);
# 3. build-std — cargo пересобирает СТАНДАРТНУЮ БИБЛИОТЕКУ (std, panic_abort)
#    под этот target, потому что готовая std для xtensa просто не существует.
#
# Всё это требует nightly-тулчейна `esp` — его подхватывает rust-toolchain.toml.

[build]
target = "xtensa-esp32s3-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
build-std-features = []