[package]
name = "ai32-core"
version = "0.1.0"
edition = "2021"
description = "AI-32: чистая (std) логика 24-канального модуля 4-20 мА — калибровка, карта Modbus, CRC. Тестируется на хосте без железа."
# ВАЖНО: этот крейт зависит ТОЛЬКО от стандартной библиотеки — поэтому его
# можно собирать и гонять обычным `cargo test` на ПК, не трогая embedded-тулчейн.
# (Раньше тут были crossbeam-channel и tempfile — они не использовались;
#  чистое ядро не ходит в сеть и не работает с файлами.)