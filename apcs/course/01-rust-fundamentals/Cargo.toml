# Workspace модуля 1: Rust Fundamentals.
#
# - корень (этот пакет) — примеры из уроков: `cargo run --example <имя>`
# - `exercises/` — пакет-упражнения с unit-тестами: `cargo test -p exercises`

[workspace]
members = [".", "exercises", "test_attempt/f32_to_u16"]
resolver = "2"

[package]
name = "rust-fundamentals"
version = "0.1.0"
edition = "2021"
description = "Rust Fundamentals: примеры и упражнения (embedded / Modbus риф)."

[[example]]
name = "00_types"
path = "examples/00_types.rs"

[[example]]
name = "01_ownership"
path = "examples/01_ownership.rs"

[[example]]
name = "02_borrowing"
path = "examples/02_borrowing.rs"

[[example]]
name = "03_lifetimes"
path = "examples/03_lifetimes.rs"

[[example]]
name = "04_structs_enums"
path = "examples/04_structs_enums.rs"

[[example]]
name = "05_traits"
path = "examples/05_traits.rs"

[[example]]
name = "06_collections"
path = "examples/06_collections.rs"

[[example]]
name = "07_errors"
path = "examples/07_errors.rs"

[[example]]
name = "08_threads"
path = "examples/08_threads.rs"

[[example]]
name = "09_practice"
path = "examples/09_practice.rs"
