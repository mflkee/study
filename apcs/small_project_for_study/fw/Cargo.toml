# Мини-полигон: кнопка + светодиод по Modbus RTU.

[package]
name = "mini-fw"
version = "0.1.0"
edition = "2021"
description = "Прошивка мини-полигона: GPIO кнопки/светодиода + RTU slave по UART"

[features]
default = []

[dependencies]
# Чистая логика: CRC + карта регистров + диспетчер (тестируется в core).
mini-core = { path = "../core" }
anyhow = "1"
esp-idf-hal = "0.44"
esp-idf-sys = { version = "0.35", features = ["binstart"] }
log = "0.4"

[profile.release]
opt-level = "s"

[profile.dev]
opt-level = "s"

[build-dependencies]
embuild = "0.33"