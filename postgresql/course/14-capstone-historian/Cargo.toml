[package]
name = "capstone-historian"
version = "0.1.0"
edition = "2021"
description = "Капстоун курса «Rust + PostgreSQL для СИКН»: эмулятор Modbus → шлюз → партиционированное хранилище с аудитом → REST API → Grafana"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
hex = "0.4.3"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "rust_decimal",
    "json",
    "derive",
    "migrate",
    "macros",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp-server"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[lib]
name = "capstone_historian"
path = "src/lib.rs"

[[bin]]
name = "emulator"
path = "src/bin/emulator.rs"

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"