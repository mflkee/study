[package]
name = "pg-course-module-09"
version = "0.1.0"
edition = "2021"
description = "Модуль 09 курса «Rust + PostgreSQL для СИКН»: PL/pgSQL, триггеры, аудит, LISTEN/NOTIFY, RLS"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "json",
    "derive",
] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }