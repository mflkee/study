[package]
name = "pg-course-module-12"
version = "0.1.0"
edition = "2021"
description = "Модуль 12 курса «Rust + PostgreSQL для СИКН»: тестирование (testcontainers, sqlx-тесты, property-тесты)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "rust_decimal",
    "json",
    "derive",
    "migrate",
    "macros",
] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
# Настоящий PostgreSQL в интеграционных тестах (лаба «тест миграций»).
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
# Property-based тесты точности (кейс 3, модуль 04).
proptest = "1.11.0"