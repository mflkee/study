schema: spec-driven

context: |
  # Курс: ТГУ, 5 семестр — «Теория и практика многопоточности» (Netology)
  # Каталог курса = корень проекта. Тексты заданий лежат в `Домашнее задание N (дедлайн ...)/Домашнее задание N.md`.

  ## Реализуемый продукт
  Единое Spring Boot MVC-приложение — прототип итогового ДЗ (**вариант 3: парсер вакансий**):
  многопоточный сбор данных с сайтов вакансий, сохранение в H2, выдача через REST.
  Итоговое ДЗ требует: кастомный `ExecutorService`/`ForkJoinPool`, `@Scheduled`,
  H2, эндпоинт результата, `parallelStream()` для выборки из H2, потокобезопасные структуры.
  Домашние задания 1–8 — наращивающие блоки этого приложения, а не отдельные игрушки.

  ## Стек (проверено на машине)
  - JDK: 26 установлен; компилируем под `--release 21`
  - Сборка: Maven 3.9.x (Gradle не установлен)
  - Spring Boot: 4.1.x (Spring MVC, `@Scheduled`)
  - Персистентность: H2 (in-memory/file), Spring Data JPA
  - Тесты: JUnit 5
  - JDK-тулы для отчётов: `jstack`, `jcmd` доступны в PATH

  ## Структура
  - `pom.xml` в корне курса — агрегатор (`packaging: pom`, модуль `app`), нужен только
    чтобы команда `mvn -pl app ...` работала из корня. Код приложения в нём не живёт.
  - `app/` — единственный Maven-проект приложения (`app/pom.xml`), исходники в `app/src/{main,test}/java`
  - Базовый пакет: `ru.tsu.tpm.vacancyparser`
  - На каждое ДЗ — свой пакет верхнего уровня: `hw01.basics`, `hw02.lifecycle`,
    `hw03.parallel`, `hw04.synchronization`, `hw05.locks`, `hw06.atomics`,
    `hw07.deadlock`, `hw08.pool`
  - Демо запускаются изолированно: `@Component implements ApplicationRunner` +
    `@ConditionalOnProperty("app.hw")`; запуск `mvn -pl app spring-boot:run -Dspring-boot.run.arguments=--app.hw=hw03`
  - Общие утилиты (тайминг, дамп потоков, консольный вывод) — в `ru.tsu.tpm.vacancyparser.common`
  - Отчёт по каждому ДЗ — `Домашнее задание N (дедлайн ...)/README.md`

  ## Соглашения
  - Отчёт = Markdown, повторяет чек-лист самопроверки из текста ДЗ
  - Ссылку на отчёт в ЛМС ставит студент вручную — в задачи это не входит
  - Итоговое ДЗ (дедлайн 08.11.2026) в планирование OpenSpec **не входит**

# Per-artifact rules (optional)
rules:
  proposal:
    - Начинай с указания номера ДЗ и его дедлайна
    - Явно перечисляй пункты чек-листа самопроверки из текста задания
  tasks:
    - Каждая задача должна содержать проверку (тест, команда или наблюдаемый вывод)
    - Тесты и отчёт размещать в той же группе задач, что и реализация

operations:
  apply:
    guidance:
      - Демо-DZ сначала запускать вручную, вывод прикладывать в отчёт как есть
  archive:
    guidance:
      - В отчёте фиксировать фактические измеренные цифры, а не ожидаемые
