# Каркас прототипа Итогового ДЗ (вариант 3 — парсер вакансий).
# Демонстрации ДЗ запускаются по требованию: --app.hw=hw01, --app.hw=hw02, ...
spring.main.banner-mode=off

# Порт веб-контекста. ДЗ 1 использует его только как признак поднятого контекста.
# 8080 на машине разработки занят qbittorrent-nox, поэтому приложение слушает 8081.
# Переопределяется при запуске: --server.port=<порт>
server.port=8081
