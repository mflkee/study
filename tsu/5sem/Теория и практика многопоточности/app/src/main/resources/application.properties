# Каркас прототипа Итогового ДЗ (вариант 3 — парсер вакансий).
# Демонстрации ДЗ запускаются по требованию: --app.hw=hw01, --app.hw=hw02, ...
spring.main.banner-mode=off

# Порт веб-контекста. ДЗ 1 использует его только как признак поднятого контекста.
# 8080 на машине разработки занят qbittorrent-nox, поэтому приложение слушает 8081.
# Переопределяется при запуске: --server.port=<порт>
server.port=8081

# ---------------------------------------------------------------------------
# Итоговое ДЗ: H2 (файловая БД). Файл лежит в каталоге запуска: ./data/finaltask.mv.db
# (при `cd app && mvn spring-boot:run` каталог запуска — app/, то есть app/data/).
# AUTO_SERVER=TRUE позволяет подключиться к той же БД внешним инструментом, пока
# приложение работает. Схему создаёт/обновляет Hibernate: ddl-auto=update.
# Внимание: H2 2.4 не поддерживает AUTO_SERVER вместе с DB_CLOSE_ON_EXIT=FALSE.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/finaltask;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Итоговое ДЗ: параметры приложения (app.final.*).
# Меняются аргументами запуска без правки кода, например:
#   --app.final.pool.size=8
#   --app.final.schedule.fixed-delay-ms=5000
# ---------------------------------------------------------------------------

# Пул потоков обхода: фиксированный размер и ограниченная очередь задач.
app.final.pool.size=4
app.final.pool.queue-capacity=64
app.final.pool.shutdown-timeout-ms=5000

# Таймауты HTTP-клиента (RestTemplate): соединение и чтение ответа.
app.final.http.connect-timeout-ms=2000
app.final.http.read-timeout-ms=5000

# Общий предел времени на один обход (страховка от зависания).
app.final.crawl.total-timeout-ms=30000

# Расписание периодического обхода очереди (@Scheduled, fixedDelay).
# initial-delay — пауза после старта, batch-size — сколько адресов брать за цикл.
app.final.schedule.initial-delay-ms=5000
app.final.schedule.fixed-delay-ms=20000
app.final.schedule.batch-size=20

# Демонстрационный источник: локальный HTTP-сервер-заглушка с 12 страницами вакансий.
# Работает без интернета; задержка на страницу делает выигрыш от параллельности измеримым.
app.final.demo.enabled=true
app.final.demo.pages=12
app.final.demo.page-delay-ms=120
app.final.demo.crawl-on-startup=true

# ---------------------------------------------------------------------------
# ДЗ 10. CompletableFuture: асинхронная выборка по списку идентификаторов.
# Источник данных — локальная HTTP-заглушка на свободном порту: сеть не нужна,
# задержка ответа делает выигрыш асинхронной версии измеримым.
# Переопределяется без правки кода, например:
#   --app.hw10.pool-size=3 --app.hw10.latency-millis=50
# ---------------------------------------------------------------------------
app.hw10.pool-size=6
app.hw10.latency-millis=120
app.hw10.transform-delay-millis=10
app.hw10.connect-timeout-millis=1000
app.hw10.request-timeout-millis=2000
app.hw10.shutdown-timeout-millis=3000
app.hw10.ids=v-01,v-02,v-03,v-04,v-05,v-06,v-07,v-08,v-09,v-10,v-11,v-12
# Идентификатор, на котором «падает» источник вакансий (handle исключает вакансию из результата).
app.hw10.details-fail-id=v-07
# Идентификатор, на котором «падает» справочник компаний (exceptionally подставляет заглушку).
app.hw10.company-fail-id=v-04
# Сколько строк журнала «поток + ID запроса» печатать в демонстрации.
app.hw10.trace-lines=14

# ---------------------------------------------------------------------------
# ДЗ 11. Fork/Join: подсчёт агрегированных вакансий партиями.
# Размер набора, партия, параллелизм и критерий — параметры эксперимента.
# Переопределяется без правки кода, например:
#   --app.hw11.dataset-size=2000000 --app.hw11.batch-size=10000
# ---------------------------------------------------------------------------
app.hw11.dataset-size=1000000
app.hw11.batch-size=5000
app.hw11.pool-size=8
app.hw11.batch-sizes=1000,5000,20000,100000
app.hw11.pool-sizes=2,4,8
app.hw11.repeats=2
app.hw11.seed=2026
app.hw11.criteria-city=\u0422\u043e\u043c\u0441\u043a
app.hw11.criteria-min-salary=100000
app.hw11.criteria-keyword=java

# ---------------------------------------------------------------------------
# ДЗ 13. BlockingQueue: производители кладут URL, потребители скачивают и извлекают <title>.
# Источник — локальный сайт-заглушка на свободном порту (сеть не нужна).
# Две ёмкости очереди: маленькая показывает обратное давление, большая — накопление задач.
# Переопределяется без правки кода, например:
#   --app.hw13.pages=60 --app.hw13.consumers=6 --app.hw13.queue-capacity=8
# ---------------------------------------------------------------------------
app.hw13.pages=24
app.hw13.producers=3
app.hw13.consumers=3
app.hw13.queue-capacity=4
app.hw13.comparison-capacity=32
app.hw13.page-delay-millis=60
app.hw13.connect-timeout-millis=1000
app.hw13.request-timeout-millis=2000
app.hw13.shutdown-timeout-millis=10000
app.hw13.sample-titles=5
app.hw13.trace-lines=10

# ---------------------------------------------------------------------------
# ДЗ 12. Многопоточные коллекции: кэш вакансий (TTL + ёмкость) и шина событий.
# Параметры нагрузки и замеров. Переопределяется без правки кода, например:
#   --app.hw12.threads=4 --app.hw12.keys=100 --app.hw12.benchmark-ops-per-thread=20000
# ---------------------------------------------------------------------------
app.hw12.threads=8
app.hw12.keys=200
app.hw12.ops-per-thread=2000
app.hw12.loader-delay-millis=1
app.hw12.ttl-millis=300
app.hw12.cache-capacity=256
app.hw12.log-limit=100
app.hw12.subscribers=3
app.hw12.ttl-keys=5
app.hw12.eviction-capacity=128
app.hw12.eviction-insertions=340
app.hw12.benchmark-threads=8
app.hw12.benchmark-keys=1000
app.hw12.benchmark-ops-per-thread=50000
app.hw12.top-size=5

# ---------------------------------------------------------------------------
# ДЗ 14. Проект Loom: виртуальные потоки против платформенного пула на блокирующем IO.
# Источник страниц — локальный сайт-заглушка (сеть не нужна), задержка имитирует сеть.
# Все числа — параметры эксперимента, переопределяются без правки кода, например:
#   --app.hw14.pages=400 --app.hw14.fixed-pool-size=8 --app.hw14.scaling-tasks=5000
# ---------------------------------------------------------------------------
app.hw14.pages=200
app.hw14.page-delay-millis=50
app.hw14.fixed-pool-size=16
app.hw14.scaling-tasks=10000
app.hw14.scaling-delay-millis=50
app.hw14.platform-pool-size=200
app.hw14.pinning-tasks=96
app.hw14.pinning-block-millis=60
app.hw14.connect-timeout-millis=1000
app.hw14.request-timeout-millis=5000
app.hw14.task-timeout-millis=60000
app.hw14.shutdown-timeout-millis=5000
app.hw14.sample-titles=5

# ---------------------------------------------------------------------------
# Демонстрации ДЗ закрывают Spring-контекст из ApplicationRunner, и Tomcat при этом
# пишет в журнал ожидаемое AsynchronousCloseException «Socket accept failed».
# Это не ошибка приложения, а гонка остановки акцептора; в отчётах она только шумит.
# ---------------------------------------------------------------------------
logging.level.org.apache.tomcat.util.net.Acceptor=OFF
